# ParaScript portal, published like the services in ~/server/docker.
# LAN:        http://lindeque-family-server.local:3000
# Cloudflare: http://127.0.0.1:3000

services:
  portal:
    build: .
    image: parascript-portal
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:" + process.env.PORT + "/").then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
