<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>ParaScript</title>
    <meta name="description" content="A prompt alone rarely produces a solid. ParaScript assets let a model write a script, and the workspace builds the model.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/site.css">
    <link rel="describedby" href="/llms.txt" type="text/plain" title="Index for language models">
</head>
<body>
    <header class="site">
        <a class="brand" href="/">ParaScript</a>
        <nav>
            <a href="/language">Language</a>
            <a href="/workspace">Workspace</a>
        </nav>
    </header>
    <main class="home">
        <p class="eyebrow">Solid models as text</p>
        <h1>A language for solid models.</h1>
        <figure class="workflow">
            <div class="path path-weak">
                <p class="path-label">Prompt only</p>
                <ol class="flow">
                    <li>Prompt</li>
                    <li class="join" aria-hidden="true">→</li>
                    <li>AI</li>
                    <li class="join" aria-hidden="true">→</li>
                    <li class="result-weak">Model<span>Unlikely</span></li>
                </ol>
            </div>
            <div class="path path-strong">
                <p class="path-label">Prompt and the assets</p>
                <ol class="flow">
                    <li class="bundle"><span>Prompt</span><span class="plus" aria-hidden="true">+</span><span>Assets</span></li>
                    <li class="join" aria-hidden="true">→</li>
                    <li>AI</li>
                    <li class="join" aria-hidden="true">→</li>
                    <li>Script</li>
                    <li class="join" aria-hidden="true">→</li>
                    <li class="result-strong">Model<span>From the script</span></li>
                </ol>
            </div>
            <figcaption>A prompt alone asks a model to invent the solid. With the assets it writes a script, and the workspace builds the model.</figcaption>
        </figure>
        <p class="actions">
            <a class="primary" href="/workspace">Open the workspace</a>
            <a class="secondary" href="/parascript-assets.md">Download the AI assets</a>
            <a class="secondary" href="/language">See how it works</a>
        </p>
        <figure class="sample">
            <figcaption>Sphere(radius:) is centered on the origin. The radius is chosen at the call. <a href="/workspace?example=sphere">Open this script</a></figcaption>
            <pre><code><span class="kw">setup</span> {
    <span class="name">name</span>: <span class="str">"Sphere"</span>,
    <span class="name">units</span>: <span class="str">"mm"</span>,
    <span class="name">coordinate_system</span>: <span class="str">"Z-up"</span>
}

<span class="kw">export</span>(<span class="fn">Sphere</span>(<span class="name">radius</span>: <span class="num">25.0</span>))</code></pre>
        </figure>
    </main>
</body>
</html>
